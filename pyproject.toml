[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-science-ecosystem-lab"
version = "0.3.0"
description = "GitHub-native life-science knowledge workflow and independent research-evidence tool"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Xuanyi Jiang"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/lostlight530/life-science-ecosystem-lab"
Documentation = "https://github.com/lostlight530/life-science-ecosystem-lab/tree/main/docs"
Source = "https://github.com/lostlight530/life-science-ecosystem-lab"
Issues = "https://github.com/lostlight530/life-science-ecosystem-lab/issues"

[project.scripts]
ls-knowledge = "life_science_ecosystem_lab.cli:main"
ls-evidence = "evidence.cli:main"

[tool.setuptools]
packages = ["life_science_ecosystem_lab", "life_science_ecosystem_lab.lifecycle", "evidence"]

[tool.setuptools.package-dir]
life_science_ecosystem_lab = ".github/runtime/life_science_ecosystem_lab"
"life_science_ecosystem_lab.lifecycle" = ".github/runtime/life_science_ecosystem_lab/lifecycle"
evidence = "evidence"

