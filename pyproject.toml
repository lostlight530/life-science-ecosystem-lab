[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-science-ecosystem-lab"
version = "0.1.0"
description = "Pilot tools for research workflow profiles and deterministic research-record integrity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Xuanyi Jiang"}]
dependencies = []

[project.scripts]
ls-ecosystem-lab = "life_science_ecosystem_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

