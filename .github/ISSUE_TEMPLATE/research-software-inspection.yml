name: Research software inspection
description: Report a reproducible static Tool inspection issue using public or synthetic data
body:
  - type: markdown
    attributes:
      value: "Report only public project links and minimized synthetic fixtures. Do not submit credentials, private research plans or personal/health data."
  - type: input
    id: object
    attributes:
      label: Inspected research object
      description: Public repository URL and immutable revision, or synthetic fixture name
      placeholder: "https://github.com/owner/repo at commit SHA"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected observable behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual tool result and command
      description: Provide only sanitized output; do not paste secrets or private internal designs
    validations:
      required: true