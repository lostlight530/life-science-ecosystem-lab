name: Evidence or knowledge verification failure
description: Report a reproducible public verification or knowledge regression
labels: ["verification"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected state or result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed failure, commit SHA, public non-sensitive logs
    validations:
      required: true
  - type: textarea
    id: replay
    attributes:
      label: Minimal replay command and inputs
    validations:
      required: true
