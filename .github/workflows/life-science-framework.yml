name: Life Science Framework — Independent Software Engineering Contracts

on:
  pull_request:
    paths:
      - "framework/**"
      - ".github/workflows/life-science-framework.yml"
      - ".github/workflows/validate.yml"
      - "docs/ADR-INDEPENDENT-LS-FRAMEWORK.md"
  push:
    branches: [main]
    paths:
      - "framework/**"
      - ".github/workflows/life-science-framework.yml"
      - ".github/workflows/validate.yml"
      - "docs/ADR-INDEPENDENT-LS-FRAMEWORK.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-framework:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install only the independent Framework
        run: python -m pip install --no-deps -e ./framework
      - name: Compile and run adversarial tests
        run: |
          python -m compileall -q framework/src framework/tests
          python -m unittest discover -s framework/tests -v
      - name: Verify cross-domain software-contract replay
        run: |
          mkdir -p build/framework
          ls-framework assess --bundle framework/fixtures/software-cross-domain.json --root framework/fixtures --output build/framework/assessment.json
          python -m ls_framework assess --bundle framework/fixtures/software-cross-domain.json --root framework/fixtures --output build/framework/replay.json
          cmp build/framework/assessment.json build/framework/replay.json
      - name: Retain compact report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: life-science-framework-software-contract
          path: build/framework/
          if-no-files-found: ignore
          retention-days: 30
