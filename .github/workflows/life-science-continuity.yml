name: Verify accepted life-science knowledge continuity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "evidence/knowledge_quality.py"
      - ".github/workflows/life-science-continuity.yml"

permissions:
  contents: read

concurrency:
  group: life-science-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ".github/runtime:."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify current Git-accepted production state
        run: |
          python -m life_science_ecosystem_lab state verify --repository-root . --require-accepted
          python -m life_science_ecosystem_lab knowledge verify --candidate data/inputs/current/candidate.json --topics evidence/profiles/topics.json --knowledge data/knowledge/current.json
          python -m life_science_ecosystem_lab graph verify --dir data/knowledge --knowledge data/knowledge/current.json
      - name: Run independent bounded Knowledge Quality audit
        run: |
          python -m evidence audit-knowledge --knowledge data/knowledge/current.json --output build/knowledge-quality.json
      - name: Retain compact health report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-knowledge-continuity
          path: build/knowledge-quality.json
          if-no-files-found: ignore
          retention-days: 14
