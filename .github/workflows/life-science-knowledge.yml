name: Life Science Knowledge Workflow — Native Lifecycle

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Reviewed source/topic profile; isolated research profiles are read-only"
        required: true
        default: native
        type: choice
        options:
          - native
          - protein_structure
      persist:
        description: "Persist a verified native-profile delta to main; ignored for isolated research profiles"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: life-science-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      PYTHONPATH: ".github/runtime:."
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Resolve reviewed source and topic profile
        env:
          REQUESTED_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'native' }}
        run: |
          python -m evidence.workflow_profiles --root . --profile "$REQUESTED_PROFILE" --output build/workflow-profile.json --github-env "$GITHUB_ENV"
      - name: Verify contracts and record
        run: |
          python -m unittest discover -s tests -v
          python -m life_science_ecosystem_lab validate-source-registry "$LS_SOURCES_PROFILE"
          python -m life_science_ecosystem_lab validate-topic-registry "$LS_TOPICS_PROFILE"
      - name: GitHub evidence collect
        run: python -m evidence collect --sources "$LS_SOURCES_PROFILE" --output build/records.json --diagnostics-output build/source-diagnostics.json
      - name: GitHub evidence aggregate
        run: |
          optional_previous=()
          if test "$LS_PROFILE_ID" = 'native' && test -f data/inputs/current/candidate.json; then
            optional_previous+=(--previous data/inputs/current/candidate.json)
          fi
          python -m evidence aggregate --input build/records.json --topics "$LS_TOPICS_PROFILE" --diagnostics build/source-diagnostics.json --output build/candidate.json "${optional_previous[@]}"
      - name: Evidence boundary validation
        run: python -m evidence validate --bundle build/candidate.json
      - name: Extract source-cited workflow knowledge
        run: python -m life_science_ecosystem_lab knowledge build --candidate build/candidate.json --topics "$LS_TOPICS_PROFILE" --output build/knowledge.json
      - name: Verify reproducible knowledge
        run: python -m life_science_ecosystem_lab knowledge verify --candidate build/candidate.json --topics "$LS_TOPICS_PROFILE" --knowledge build/knowledge.json
      - name: Audit source-cited knowledge quality
        run: python -m evidence audit-knowledge --knowledge build/knowledge.json --output build/knowledge-quality.json
      - name: Project and verify queryable graph
        run: |
          python -m life_science_ecosystem_lab graph project --knowledge build/knowledge.json --output-dir build/graph
          python -m life_science_ecosystem_lab graph verify --dir build/graph --knowledge build/knowledge.json
      - name: Verify scientific software documentation
        run: python -m evidence audit-docs --root . --files evidence/profiles/docs.json --output build/docs-audit.json
      - name: Record validation head
        run: printf '%s\n' "$GITHUB_SHA" > build/validated-head.txt
      - name: Preserve bounded diagnostics on validation failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: life-science-validation-failure
          path: |
            build/source-diagnostics.json
            build/docs-audit.json
            build/workflow-profile.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: life-science-verified-knowledge
          path: |
            build/candidate.json
            build/knowledge.json
            build/knowledge-quality.json
            build/graph/
            build/source-diagnostics.json
            build/validated-head.txt
            build/docs-audit.json
            build/workflow-profile.json
          if-no-files-found: error
          retention-days: 14

  apply:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'native' && inputs.persist == true))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      PYTHONPATH: ".github/runtime:."
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: life-science-verified-knowledge
          path: build
      - name: World-line precondition
        run: |
          python .github/scripts/verify_world_line.py --validated-head "$(cat build/validated-head.txt)"
      - name: Guarded lifecycle apply
        run: |
          python -m life_science_ecosystem_lab lifecycle apply --candidate build/candidate.json --knowledge build/knowledge.json --topics evidence/profiles/topics.json --repository-root . --logical-date "$(date -u +%F)" --validated-head "$(cat build/validated-head.txt)" --current-head "$(git rev-parse HEAD)" --execution-id "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Final validation
        run: |
          python -m life_science_ecosystem_lab state verify --repository-root . --require-accepted
          python -m life_science_ecosystem_lab knowledge verify --candidate data/inputs/current/candidate.json --topics evidence/profiles/topics.json --knowledge data/knowledge/current.json
          python -m life_science_ecosystem_lab graph verify --dir data/knowledge --knowledge data/knowledge/current.json
      - name: Write boundary and final world-line guard
        run: |
          git add -A data/
          git diff --cached --name-only > build/changed.txt
          python .github/scripts/check_write_boundary.py $(cat build/changed.txt)
          python .github/scripts/verify_world_line.py --validated-head "$(cat build/validated-head.txt)"
      - name: Persist guarded state
        run: |
          if git diff --cached --quiet; then
            echo 'NO_MEANINGFUL_DELTA'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: persist verified workflow knowledge snapshot'
            git push origin HEAD:main
          fi
      - name: Verify remote accepted state matches local commit
        run: python .github/scripts/verify_world_line.py --validated-head "$(git rev-parse HEAD)"
