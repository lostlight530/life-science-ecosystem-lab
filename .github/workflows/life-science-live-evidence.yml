name: Life Science Live Evidence Drill — Read Only

on:
  push:
    branches:
      - experiment/live-evidence-20261017
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-science-live-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-world:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ".github/runtime:."
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout trusted inspector and workflow code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Collect real approved public GitHub sources without persistence
        run: |
          python -m pip install -e .
          mkdir -p build/live
          ls-evidence collect --sources evidence/profiles/sources.json --output build/live/records.json --diagnostics-output build/live/source-diagnostics.json
          ls-evidence aggregate --input build/live/records.json --topics evidence/profiles/topics.json --diagnostics build/live/source-diagnostics.json --output build/live/candidate.json
          ls-evidence validate --bundle build/live/candidate.json
          ls-knowledge knowledge build --candidate build/live/candidate.json --topics evidence/profiles/topics.json --output build/live/knowledge.json
          ls-knowledge knowledge verify --candidate build/live/candidate.json --topics evidence/profiles/topics.json --knowledge build/live/knowledge.json
          ls-knowledge graph project --knowledge build/live/knowledge.json --output-dir build/live/graph
          ls-knowledge graph verify --dir build/live/graph --knowledge build/live/knowledge.json
          ls-knowledge graph search --dir build/live/graph --query workflow --limit 5 --hops 1 > /dev/null
      - name: Fetch real third-party RNA-seq pipeline (pinned public revision)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nf-core/rnaseq
          ref: 95dbcd977a74a4d1b2a3954abb90df3851014afa
          path: build/external/rnaseq
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1
      - name: Fetch real third-party workflow monitor (pinned public revision)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: crs4/life_monitor
          ref: 7649406c11c5c04eebc5ca61926f5dbe30469c82
          path: build/external/life_monitor
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1
      - name: Execute installed Evidence Tool against actual external repositories
        run: |
          set +e
          ls-evidence inspect --root build/external/rnaseq --output build/live/rnaseq-inspection.json --markdown build/live/rnaseq-inspection.md --sarif build/live/rnaseq-inspection.sarif
          rnaseq_status=$?
          ls-evidence inspect --root build/external/life_monitor --output build/live/lifemonitor-inspection.json --markdown build/live/lifemonitor-inspection.md --sarif build/live/lifemonitor-inspection.sarif
          lifemonitor_status=$?
          set -e
          echo "RNASEQ_TOOL_EXIT=$rnaseq_status LIFEMONITOR_TOOL_EXIT=$lifemonitor_status"
          test "$rnaseq_status" -le 1
          test "$lifemonitor_status" -le 1
          test -s build/live/rnaseq-inspection.json
          test -s build/live/lifemonitor-inspection.json
      - name: Publish source identities, real findings and eligibility without upstream text
        run: |
          python .github/scripts/live_evidence_report.py --candidate build/live/candidate.json --knowledge build/live/knowledge.json --rnaseq-report build/live/rnaseq-inspection.json --lifemonitor-report build/live/lifemonitor-inspection.json --output build/live/live-drill-summary.json
      - name: Upload bounded non-production result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-life-science-read-only-evidence
          path: |
            build/live/live-drill-summary.json
            build/live/source-diagnostics.json
            build/live/rnaseq-inspection.json
            build/live/rnaseq-inspection.md
            build/live/rnaseq-inspection.sarif
            build/live/lifemonitor-inspection.json
            build/live/lifemonitor-inspection.md
            build/live/lifemonitor-inspection.sarif
            build/live/graph/graph-manifest.json
          if-no-files-found: warn
          retention-days: 14
