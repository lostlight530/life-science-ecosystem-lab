name: Build Workflow Knowledge and Validate Evidence

on:
  workflow_dispatch:
    inputs:
      persist:
        description: "Explicitly persist validated knowledge and evidence snapshots to main"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: rs12-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify contracts and record
        run: |
          python -m unittest discover -s tests -v
          python -m life_science_ecosystem_lab validate-source-registry profiles/sources.json
          python -m life_science_ecosystem_lab validate-topic-registry profiles/topics.json
      - name: GitHub evidence collect
        run: python -m life_science_ecosystem_lab evidence collect --sources profiles/sources.json --output build/records.json
      - name: GitHub evidence aggregate
        run: python -m life_science_ecosystem_lab evidence aggregate --input build/records.json --topics profiles/topics.json --output build/candidate.json
      - name: Evidence boundary validation
        run: python -m life_science_ecosystem_lab evidence validate --bundle build/candidate.json
      - name: Extract source-cited workflow knowledge
        run: python -m life_science_ecosystem_lab knowledge build --candidate build/candidate.json --topics profiles/topics.json --output build/knowledge.json
      - name: Verify reproducible knowledge
        run: python -m life_science_ecosystem_lab knowledge verify --candidate build/candidate.json --topics profiles/topics.json --knowledge build/knowledge.json
      - name: Record validation head
        run: printf '%s\n' "$GITHUB_SHA" > build/validated-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rs12-verified-knowledge
          path: |
            build/candidate.json
            build/knowledge.json
            build/validated-head.txt
          if-no-files-found: error
          retention-days: 14

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.persist == true && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rs12-verified-knowledge
          path: build
      - name: World-line precondition
        run: |
          python scripts/verify_world_line.py --validated-head "$(cat build/validated-head.txt)"
      - name: Guarded lifecycle apply
        run: |
          python -m life_science_ecosystem_lab lifecycle apply --candidate build/candidate.json --knowledge build/knowledge.json --topics profiles/topics.json --repository-root . --logical-date "$(date -u +%F)" --validated-head "$(cat build/validated-head.txt)" --current-head "$(git rev-parse HEAD)"
      - name: Final validation
        run: |
          python -m life_science_ecosystem_lab state verify --repository-root .
          python -m life_science_ecosystem_lab knowledge verify --candidate data/inputs/current/candidate.json --topics profiles/topics.json --knowledge data/knowledge/current.json
      - name: Write boundary and final world-line guard
        run: |
          git add -A data/
          git diff --cached --name-only > build/changed.txt
          python scripts/check_write_boundary.py $(cat build/changed.txt)
          python scripts/verify_world_line.py --validated-head "$(cat build/validated-head.txt)"
      - name: Persist guarded state
        run: |
          if git diff --cached --quiet; then
            echo 'NO_MEANINGFUL_DELTA'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: persist verified workflow knowledge snapshot'
            git push origin HEAD:main
          fi
