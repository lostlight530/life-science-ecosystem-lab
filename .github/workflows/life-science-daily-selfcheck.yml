name: Daily research self-check — Institutional defaults and project custom

on:
  schedule:
    # 09:41 Asia/Shanghai, every day (UTC is the Actions scheduler timezone).
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      live_public_institutions:
        description: "Read-only public official endpoint observations; no login or registration"
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - "checks/**"
      - "lifemonitor.yaml"
      - ".lifemonitor.yaml"
      - ".github/scripts/check_metadata.py"
      - "metadata/standards-status.json"
      - "docs/STANDARDS.md"
      - "evidence/daily_selfcheck.py"
      - "evidence/daily_custom_runner.py"
      - "tests/test_daily_custom_runner.py"
      - "tests/test_workflow_contracts.py"
      - "tests/test_institutional_selfcheck.py"
      - "tests/test_project_selfcheck.py"
      - ".github/workflows/life-science-daily-selfcheck.yml"
      - "docs/DAILY_SELF_CHECK.md"
  push:
    branches: [main]
    paths:
      - "checks/**"
      - "lifemonitor.yaml"
      - ".lifemonitor.yaml"
      - ".github/scripts/check_metadata.py"
      - "metadata/standards-status.json"
      - "docs/STANDARDS.md"
      - "evidence/daily_selfcheck.py"
      - "evidence/daily_custom_runner.py"
      - "tests/test_daily_custom_runner.py"
      - "tests/test_workflow_contracts.py"
      - "tests/test_institutional_selfcheck.py"
      - "tests/test_project_selfcheck.py"
      - ".github/workflows/life-science-daily-selfcheck.yml"
      - "docs/DAILY_SELF_CHECK.md"

permissions:
  contents: read

concurrency:
  group: life-science-daily-selfcheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  institutional-defaults:
    name: Institutional defaults — public read-only observations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ".github/runtime:."
      PYTHONDONTWRITEBYTECODE: "1"
      PUBLIC_LIVE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_public_institutions == true) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify official curated URL contract independently
        run: |
          python -m unittest discover -s tests -p 'test_institutional_selfcheck.py' -v
          if [ "$PUBLIC_LIVE" = "true" ]; then
            python -m evidence.daily_selfcheck institutional --catalogue checks/institutional/defaults.json --output build/daily-selfcheck/institutional-defaults/report.json --live
          else
            python -m evidence.daily_selfcheck institutional --catalogue checks/institutional/defaults.json --output build/daily-selfcheck/institutional-defaults/report.json
          fi
      - name: Retain institutional observation only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: institutional-defaults
          path: build/daily-selfcheck/institutional-defaults/report.json
          if-no-files-found: ignore
          retention-days: 30

  project-custom:
    name: Project custom — three assets and accepted evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ".github/runtime:."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run isolated custom checks with complete failure ledger
        run: |
          python -m evidence.daily_custom_runner --root . --registry checks/project/daily_checks.json --output build/daily-selfcheck/project-custom/execution-report.json
      - name: Retain project evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: project-custom
          path: build/daily-selfcheck/project-custom/
          if-no-files-found: ignore
          retention-days: 30
