name: Daily research self-check — Institutional defaults and project custom

on:
  schedule:
    # 09:41 Asia/Shanghai, every day (UTC is the Actions scheduler timezone).
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      live_public_institutions:
        description: "Read-only public official endpoint observations; no login or registration"
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - "checks/**"
      - "evidence/daily_selfcheck.py"
      - "tests/test_daily_selfcheck.py"
      - ".github/workflows/life-science-daily-selfcheck.yml"
      - "docs/DAILY_SELF_CHECK.md"
  push:
    branches: [main]
    paths:
      - "checks/**"
      - "evidence/daily_selfcheck.py"
      - "tests/test_daily_selfcheck.py"
      - ".github/workflows/life-science-daily-selfcheck.yml"
      - "docs/DAILY_SELF_CHECK.md"

permissions:
  contents: read

concurrency:
  group: life-science-daily-selfcheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  institutional-defaults:
    name: Institutional defaults — public read-only observations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ".github/runtime:."
      PYTHONDONTWRITEBYTECODE: "1"
      PUBLIC_LIVE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_public_institutions == true) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify official curated URL contract independently
        run: |
          python -m unittest tests.test_daily_selfcheck -v
          if [ "$PUBLIC_LIVE" = "true" ]; then
            python -m evidence.daily_selfcheck institutional --catalogue checks/institutional/defaults.json --output build/daily-selfcheck/institutional-defaults/report.json --live
          else
            python -m evidence.daily_selfcheck institutional --catalogue checks/institutional/defaults.json --output build/daily-selfcheck/institutional-defaults/report.json
          fi
      - name: Retain institutional observation only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: institutional-defaults
          path: build/daily-selfcheck/institutional-defaults/report.json
          if-no-files-found: ignore
          retention-days: 30

  project-custom:
    name: Project custom — three assets and accepted evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ".github/runtime:."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check project manifest and locally authored file digests
        run: |
          python -m evidence.daily_selfcheck project --root . --manifest checks/project/manifest.json --output build/daily-selfcheck/project-custom/file-contract.json
      - name: Verify scientific software, public docs and accepted Git state
        run: |
          python -m unittest discover -s tests -v
          python -m evidence audit-docs --root . --files evidence/profiles/docs.json --output build/daily-selfcheck/project-custom/docs-audit.json
          python .github/scripts/check_metadata.py
          python .github/scripts/check_rocrate.py
          python .github/scripts/check_publication_boundary.py
          python -m life_science_ecosystem_lab state verify --repository-root . --require-accepted
          python -m life_science_ecosystem_lab knowledge verify --candidate data/inputs/current/candidate.json --topics evidence/profiles/topics.json --knowledge data/knowledge/current.json
          python -m life_science_ecosystem_lab graph verify --dir data/knowledge --knowledge data/knowledge/current.json
          python -m evidence audit-knowledge --knowledge data/knowledge/current.json --output build/daily-selfcheck/project-custom/knowledge-quality.json
      - name: Retain project evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: project-custom
          path: build/daily-selfcheck/project-custom/
          if-no-files-found: ignore
          retention-days: 30
