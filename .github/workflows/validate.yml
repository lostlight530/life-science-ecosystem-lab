name: Validate computational workflow and evidence contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CWL reference runner
        run: python -m pip install cwltool
      - name: Compile source and run regression tests
        run: |
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests -v
      - name: Validate profiles and crate metadata
        run: |
          python -m life_science_ecosystem_lab validate-source-registry profiles/sources.json
          python -m life_science_ecosystem_lab validate-topic-registry profiles/topics.json
          python -m life_science_ecosystem_lab validate-workflow-profile examples/workflow-profile.json
          python scripts/check_rocrate.py
      - name: Execute the actual CWL knowledge workflow
        run: |
          mkdir -p build/cwl-one build/cwl-two
          cwltool --no-container --outdir build/cwl-one workflow/main.cwl test/workflow-job.yml
          cwltool --no-container --outdir build/cwl-two workflow/main.cwl test/workflow-job.yml
          diff -u build/cwl-one/knowledge.json build/cwl-two/knowledge.json
          diff -u build/cwl-one/candidate.json build/cwl-two/candidate.json
          python -m life_science_ecosystem_lab knowledge verify --candidate build/cwl-one/candidate.json --topics profiles/topics.json --knowledge build/cwl-one/knowledge.json
      - name: Verify reproducible workflow crate
        run: |
          python scripts/build_rocrate.py build/one.crate.zip
          python scripts/build_rocrate.py build/two.crate.zip
          cmp build/one.crate.zip build/two.crate.zip
      - name: Enforce repository hygiene
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache)(/|$)|\.pyc$'; then
            echo 'Generated cache files are not allowed'
            exit 1
          fi
