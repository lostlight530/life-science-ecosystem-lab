name: Validate life-science workflow and evidence contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ".github/runtime:."
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CWL reference runner
        run: python -m pip install cwltool
      - name: Compile source and run regression tests
        run: |
          python -m compileall -q .github/runtime evidence tests .github/scripts
          python -m pip install --no-deps -e .
          python -m unittest discover -s tests -v
      - name: Validate profiles and crate metadata
        run: |
          python -m life_science_ecosystem_lab validate-source-registry evidence/profiles/sources.json
          python -m life_science_ecosystem_lab validate-topic-registry evidence/profiles/topics.json
          python -m life_science_ecosystem_lab validate-workflow-profile evidence/examples/workflow-profile.json
          python .github/scripts/check_rocrate.py
          python .github/scripts/check_metadata.py
          python .github/scripts/check_publication_boundary.py
          ls-evidence audit-docs --root . --files evidence/profiles/docs.json --output build/docs-audit.json
      - name: Execute the actual CWL knowledge workflow
        run: |
          mkdir -p build/cwl-one build/cwl-two
          cwltool --no-container --outdir build/cwl-one .github/knowledge/main.cwl .github/knowledge/test/workflow-job.yml
          cwltool --no-container --outdir build/cwl-two .github/knowledge/main.cwl .github/knowledge/test/workflow-job.yml
          diff -u build/cwl-one/knowledge.json build/cwl-two/knowledge.json
          diff -u build/cwl-one/candidate.json build/cwl-two/candidate.json
          python -m life_science_ecosystem_lab knowledge verify --candidate build/cwl-one/candidate.json --topics evidence/profiles/topics.json --knowledge build/cwl-one/knowledge.json
      - name: Audit accepted cross-version knowledge contracts
        run: |
          ls-evidence audit-knowledge --knowledge data/knowledge/current.json --output build/accepted-quality.json
          ls-evidence audit-knowledge --knowledge build/cwl-one/knowledge.json --previous build/cwl-two/knowledge.json --output build/replay-quality.json
      - name: Verify JSONL graph and independent static Tool
        run: |
          python -m life_science_ecosystem_lab graph project --knowledge build/cwl-one/knowledge.json --output-dir build/graph
          python -m life_science_ecosystem_lab graph verify --dir build/graph --knowledge build/cwl-one/knowledge.json
          python -m life_science_ecosystem_lab graph search --dir build/graph --query workflow --limit 3 --hops 1
          ls-evidence inspect --root . --output build/software-inspection.json --markdown build/software-inspection.md --sarif build/software-inspection.sarif
      - name: Verify reproducible workflow crate
        run: |
          python .github/scripts/build_rocrate.py build/one.crate.zip
          python .github/scripts/build_rocrate.py build/two.crate.zip
          cmp build/one.crate.zip build/two.crate.zip
      - name: Build reproducible portable CWL main crate
        run: |
          python .github/scripts/build_portable_workflow_crate.py build/portable-one.crate.zip
          python .github/scripts/build_portable_workflow_crate.py build/portable-two.crate.zip
          cmp build/portable-one.crate.zip build/portable-two.crate.zip
          ls-evidence audit-ecosystem --root . --output build/external-readiness.json
      - name: Independent evidence tool contract checks
        run: |
          ls-evidence aggregate --input evidence/examples/evidence-records.json --topics evidence/profiles/topics.json --output build/tool-candidate.json
          ls-evidence validate --bundle build/tool-candidate.json
          python -m life_science_ecosystem_lab knowledge build --candidate build/tool-candidate.json --topics evidence/profiles/topics.json --output build/tool-knowledge.json
          python -m life_science_ecosystem_lab knowledge verify --candidate build/tool-candidate.json --topics evidence/profiles/topics.json --knowledge build/tool-knowledge.json
      - name: Enforce repository hygiene
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache)(/|$)|\.pyc$'; then
            echo 'Generated cache files are not allowed'
            exit 1
          fi
