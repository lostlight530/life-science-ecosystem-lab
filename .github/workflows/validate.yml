name: Validate life-science workflow and evidence contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ".github/runtime:."
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Initialize repository-contract diagnostics
        run: |
          mkdir -p build/gate-diagnostics
          printf 'repository-contracts started\n' > build/gate-diagnostics/repository-contracts.txt
      - name: Compile source and run regression tests
        run: |
          python -m compileall -q .github/runtime evidence bio_tool tests .github/scripts
          python -m pip install --no-deps -e .
          python -m unittest discover -s tests -v
      - name: Validate profiles, metadata and public boundaries
        run: |
          python -m life_science_ecosystem_lab validate-source-registry evidence/profiles/sources.json
          python -m life_science_ecosystem_lab validate-topic-registry evidence/profiles/topics.json
          python -m life_science_ecosystem_lab validate-workflow-profile evidence/examples/workflow-profile.json
          python .github/scripts/check_rocrate.py
          python .github/scripts/check_metadata.py
          python .github/scripts/check_publication_boundary.py
          ls-evidence audit-docs --root . --files evidence/profiles/docs.json --output build/docs-audit.json
      - name: Enforce tracked repository hygiene
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache)(/|$)|\.pyc$'; then
            echo 'Generated cache files are not allowed'
            exit 1
          fi
      - name: Retain repository-contract diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-contract-diagnostics
          path: |
            build/gate-diagnostics/repository-contracts.txt
            build/docs-audit.json
          if-no-files-found: warn
          retention-days: 30

  knowledge-workflow:
    name: Knowledge Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install local package and CWL reference runner
        run: |
          python -m pip install --no-deps -e .
          python -m pip install cwltool
      - name: Initialize Knowledge Workflow diagnostics
        run: |
          mkdir -p build/gate-diagnostics
          printf 'knowledge-workflow started\n' > build/gate-diagnostics/knowledge-workflow.txt
      - name: Replay and verify the portable knowledge workflow
        run: |
          mkdir -p build/cwl-one build/cwl-two
          cwltool --no-container --outdir build/cwl-one .github/knowledge/main.cwl .github/knowledge/test/workflow-job.yml
          cwltool --no-container --outdir build/cwl-two .github/knowledge/main.cwl .github/knowledge/test/workflow-job.yml
          diff -u build/cwl-one/knowledge.json build/cwl-two/knowledge.json
          diff -u build/cwl-one/candidate.json build/cwl-two/candidate.json
          python -m life_science_ecosystem_lab knowledge verify --candidate build/cwl-one/candidate.json --topics evidence/profiles/topics.json --knowledge build/cwl-one/knowledge.json
          ls-evidence audit-knowledge --knowledge data/knowledge/current.json --output build/accepted-quality.json
          ls-evidence audit-knowledge --knowledge build/cwl-one/knowledge.json --previous build/cwl-two/knowledge.json --output build/replay-quality.json
          python -m life_science_ecosystem_lab graph project --knowledge build/cwl-one/knowledge.json --output-dir build/graph
          python -m life_science_ecosystem_lab graph verify --dir build/graph --knowledge build/cwl-one/knowledge.json
          python -m life_science_ecosystem_lab graph search --dir build/graph --query workflow --limit 3 --hops 1
      - name: Retain Knowledge Workflow diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-workflow-diagnostics
          path: |
            build/gate-diagnostics/knowledge-workflow.txt
            build/cwl-one/
            build/cwl-two/
            build/accepted-quality.json
            build/replay-quality.json
            build/graph/
          if-no-files-found: warn
          retention-days: 30

  evidence-tool:
    name: Evidence Tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install local package
        run: python -m pip install --no-deps -e .
      - name: Initialize Evidence Tool diagnostics
        run: |
          mkdir -p build/gate-diagnostics
          printf 'evidence-tool started\n' > build/gate-diagnostics/evidence-tool.txt
      - name: Verify independent Evidence Tool contracts
        run: |
          ls-evidence inspect --root . --output build/software-inspection.json --markdown build/software-inspection.md --sarif build/software-inspection.sarif
          ls-evidence aggregate --input evidence/examples/evidence-records.json --topics evidence/profiles/topics.json --output build/tool-candidate.json
          ls-evidence validate --bundle build/tool-candidate.json
          python -m life_science_ecosystem_lab knowledge build --candidate build/tool-candidate.json --topics evidence/profiles/topics.json --output build/tool-knowledge.json
          python -m life_science_ecosystem_lab knowledge verify --candidate build/tool-candidate.json --topics evidence/profiles/topics.json --knowledge build/tool-knowledge.json
      - name: Retain Evidence Tool diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-tool-diagnostics
          path: |
            build/gate-diagnostics/evidence-tool.txt
            build/software-inspection.*
            build/tool-candidate.json
            build/tool-knowledge.json
          if-no-files-found: warn
          retention-days: 30

  portable-package:
    name: Portable package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install local package and CWL reference runner
        run: |
          python -m pip install --no-deps -e .
          python -m pip install cwltool
      - name: Initialize portable-package diagnostics
        run: |
          mkdir -p build/gate-diagnostics
          printf 'portable-package started\n' > build/gate-diagnostics/portable-package.txt
      - name: Build reproducible source and portable crates
        run: |
          python .github/scripts/build_rocrate.py build/one.crate.zip
          python .github/scripts/build_rocrate.py build/two.crate.zip
          cmp build/one.crate.zip build/two.crate.zip
          python .github/scripts/build_portable_workflow_crate.py build/portable-one.crate.zip
          python .github/scripts/build_portable_workflow_crate.py build/portable-two.crate.zip
          cmp build/portable-one.crate.zip build/portable-two.crate.zip
          ls-evidence audit-ecosystem --root . --output build/external-readiness.json
      - name: Execute the distributed three-asset crate
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path('build/portable-one.crate.zip')
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              if len(names) != len(set(names)) or any(n.startswith('/') or '..' in Path(n).parts for n in names):
                  raise SystemExit('unsafe portable archive paths')
              z.extractall('build/unpacked')
          PY
          (
            cd build/unpacked
            python -m pip install --no-deps -e .
            mkdir -p ../unpacked-replay
            cwltool --no-container --outdir ../unpacked-replay .github/knowledge/main.cwl .github/knowledge/test/workflow-job.yml
            python -m bio_tool protein-fasta --input .github/bio/test/example.fasta --output ../unpacked-fasta-report.json
            python -m bio_tool protein-pdb --input .github/bio/test/example.pdb --output ../unpacked-pdb-report.json
            python -m life_science_ecosystem_lab knowledge verify --candidate ../unpacked-replay/candidate.json --topics evidence/profiles/topics.json --knowledge ../unpacked-replay/knowledge.json
          )
      - name: Compare source and distributed replay
        run: |
          mkdir -p build/source-replay
          cwltool --no-container --outdir build/source-replay .github/knowledge/main.cwl .github/knowledge/test/workflow-job.yml
          cmp build/source-replay/knowledge.json build/unpacked-replay/knowledge.json
      - name: Retain portable package and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: life-science-portable-workflow-crate
          path: |
            build/gate-diagnostics/portable-package.txt
            build/portable-one.crate.zip
            build/external-readiness.json
            build/unpacked-replay/
            build/unpacked-fasta-report.json
            build/unpacked-pdb-report.json
          if-no-files-found: warn
          retention-days: 30

  gate-verdict:
    # Preserve the historical required-check context while aggregating all domains.
    name: validate
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [repository-contracts, knowledge-workflow, evidence-tool, portable-package]
    steps:
      - name: Report and enforce all validation domains
        env:
          REPOSITORY_CONTRACTS: ${{ needs.repository-contracts.result }}
          KNOWLEDGE_WORKFLOW: ${{ needs.knowledge-workflow.result }}
          EVIDENCE_TOOL: ${{ needs.evidence-tool.result }}
          PORTABLE_PACKAGE: ${{ needs.portable-package.result }}
        run: |
          {
            echo '## Required validation verdict'
            echo
            echo "- Repository contracts result: $REPOSITORY_CONTRACTS"
            echo "- Knowledge Workflow result: $KNOWLEDGE_WORKFLOW"
            echo "- Evidence Tool result: $EVIDENCE_TOOL"
            echo "- Portable package result: $PORTABLE_PACKAGE"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$REPOSITORY_CONTRACTS" "$KNOWLEDGE_WORKFLOW" "$EVIDENCE_TOOL" "$PORTABLE_PACKAGE"; do
            if [ "$result" != 'success' ]; then
              echo 'At least one required validation domain did not succeed'
              exit 1
            fi
          done
