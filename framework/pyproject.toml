[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-sciences-rse-framework"
version = "0.1.0"
description = "Independent life-sciences cross-domain research software engineering contracts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ls-framework = "ls_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
